<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Dashboard comercial demonstrativo — dados fictícios</title>
  <desc id="description">Recriação ilustrativa de uma interface de BI, com identidade genérica BI Demo, usuário de exemplo e indicadores financeiros inteiramente fictícios. Nenhum dado operacional real é utilizado.</desc>
